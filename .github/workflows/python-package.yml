name: CI

# All path policy lives in scripts/ci/paths.json; plan.py emits job matrices.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  # Ready/label events must not cancel an in-flight fast run at the same head.
  group: ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'labeled' && github.event.label.name || github.event.action == 'ready_for_review' && 'merge' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    name: Select CI tiers and check docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      active: ${{ steps.plan.outputs.active }}
      suites: ${{ steps.plan.outputs.suites }}
      sweep: ${{ steps.plan.outputs.sweep }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select tiers from the complete PR diff
        id: plan
        run: python3 scripts/ci/plan.py
      - name: Documentation checks
        if: steps.plan.outputs.active == 'true'
        run: python3 scripts/ci/check_docs.py

  checks:
    name: Lint and publication hygiene
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Lint (syntax errors and undefined names only)
        run: pipx run --spec ruff==0.17.3 ruff check --select E9,F63,F7,F82 --output-format github .
      # Scans every tracked file; non-website documentation still runs this workflow.
      - name: Tracked-source publication hygiene
        run: python3 tests/distribution_hygiene.py --source-root .

  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: [plan, checks]
    if: needs.plan.outputs.suites != '[]'
    env:
      # Both platforms must exercise local client/server SFTP upload and fetch.
      CMW_REQUIRE_SFTP_INTEGRATION: '1'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install test dependencies
        run: python -m pip install -e '.[jobs,schema-tests]'
      # Thousands of test subprocesses import cmw; without cached bytecode each
      # recompiles it (~0.18 s). Compile once; PYTHONDONTWRITEBYTECODE still stops
      # writes during tests. Bytecode stays outside enrolled source fingerprints;
      # status request inventories compare it for changes between boundaries.
      - name: Precompile bytecode
        run: python -m compileall -q src tests
      # Keep explicit pass/fail evidence for both formerly skipped integrations.
      - name: Required local SFTP upload and download
        run: >-
          python -m unittest -v
          tests.nodes.test_transfer.TransferTests.test_actual_sftp_mechanism_with_generated_names_and_quoted_storage_path
          tests.nodes.test_fetch.FetchTests.test_actual_separate_sftp_download_and_literal_source_quoting
      # Full deterministic offline suite (synthetic engines only): one unittest
      # process per module, one per CPU, isolated state. Native engine qualification is separate.
      - name: Offline suite
        env:
          CMW_FAULT_SWEEP: representative
        run: PYTHON_BIN="$(command -v python)" bash scripts/ci/run_tests.sh "$RUNNER_TEMP/cmw-tests"

  ownership-sweep:
    if: needs.plan.outputs.sweep != '[]'
    name: Full ownership matrix / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: [plan, checks]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.sweep) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install test dependencies
        run: python -m pip install -e '.[jobs]'
      - name: Precompile bytecode
        run: python -m compileall -q src tests
      - name: Full unchanged matrix and exact row-union check
        run: PYTHON_BIN="$(command -v python)" bash scripts/ci/run_ownership_sweep.sh "$RUNNER_TEMP/cmw-ownership-matrix"

  artifacts:
    if: needs.plan.outputs.artifacts != '[]'
    name: Installed artifacts / ${{ matrix.os }} / ${{ matrix.modes }}
    needs: [plan, checks]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.artifacts) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install build frontend
        run: python -m pip install build
      # The wheel is built from the sdist; core mode installs it without the
      # optional console and runs the installed smoke outside the checkout.
      - name: Build, inspect and test fresh installations outside checkout
        env:
          CMW_ARTIFACT_MODES: ${{ matrix.modes }}
        run: PYTHON_BIN="$(command -v python)" bash scripts/ci/check_artifacts.sh "$RUNNER_TEMP/cmw-artifact-check"
